function catFor(f){
  const hay=(keyOf(f.n)+" "+keyOf(f.d)).toLowerCase();
  if(/taco|taquer/.test(hay)) return "tacos";
  if(/grill|asador|parrill|charcoal|suckling|wellington|iberian meat|mixed grill|dolma|honey cake/.test(hay)) return "grill";
  if(/seafood|fish|prawn|calamar|paella|espeto|sardine|tuna|atún|octopus|pulpo|mussel|clam|marisco|frit|swordfish|bass|mullet/.test(hay)) return "seafood";
  return "tapas";
}


let active=null, sortMode="overall";

function foodCard(f){
  const shut=active&&f.closed.includes(active);
  const days=f.closed.map(c=>T(LABEL[c]));
  const shutTxt=days.length?T(UI.closedOn)+" "+days.join(" + "):"";
  const thumb=commonsImg(FOODIMG[catFor(f)],220);
  return `<div class="pick ${f.tier==="splurge"?"splurge":""} ${shut?"shut":""}" data-shut="${esc(shutTxt)}">
    <div class="pick-img" style="background-image:url('${thumb}')" role="img" aria-label=""></div>
    <span class="tier">${T(TIER[f.tier])}${chips(f.n)}</span><strong>${T(f.n)}</strong><p>${T(f.d)}</p>
    ${f.meta?`<span class="meta">${T(f.meta)}</span>`:""}
    <span class="meta">${days.length?T(UI.closedOn)+" "+days.join(", "):T(UI.openDaily)}</span>
    ${mapBtn(f.n,f.url)}
  </div>`;
}

function zoneCard(z){
  const openCount=active?z.food.filter(f=>!f.closed.includes(active)).length:z.food.length;
  const badges=[
    z.tags.includes("anchor")?`<span class="badge anchor">${T(UI.bBook)}</span>`:"",
    z.tags.includes("near")?`<span class="badge near">${T(UI.bNear)}</span>`:"",
    `<span class="badge count">${openCount} ${T(UI.bOpen)} ${z.food.length} ${T(UI.bKitchens)}</span>`
  ].join("");
  const sights=z.sights.map(s=>`<li>
      <span class="sname"><strong>${T(s.n)}</strong><span class="hrs">${T(s.h)}</span>${chips(s.n)}</span>
      <p>${T(s.d)}</p>
      ${mapBtn(s.n,s.url)}
    </li>`).join("");
  const hero=ZONEIMG[z.id]?commonsImg(ZONEIMG[z.id],860):null;
  return `<article class="zone" id="${z.id}">
    ${hero?`<div class="zhero" style="background-image:url('${hero}')"></div>`:""}
    <button class="zhead" aria-expanded="false">
      <span class="chev">▾</span>
      <div class="zbar">${badges}</div>
      <h3>${T(z.name)}</h3>
      <p class="pitch">${T(z.pitch)}</p>
      <div class="metrics"><span>${T(z.drive)}</span><span>${T(z.dist)}</span></div>
      <div class="metrics" style="margin-top:6px"><span>${T(z.when)}</span></div>
    </button>
    <div class="zbody">
      <h4 class="sub">${T(UI.subSights)} <em>${z.sights.length} ${T(UI.subOptions)}</em></h4>
      <ul class="sights">${sights}</ul>
      <h4 class="sub">${T(UI.subFood)} <em>${T(UI.subOrder)}</em></h4>
      <div class="food">${z.food.map(foodCard).join("")}</div>
      <div class="warn"><strong>${T(UI.watch)}</strong> ${T(z.trap)}</div>
    </div>
  </article>`;
}

function renderZones(){
  const openIds=[...document.querySelectorAll(".zone.open")].map(z=>z.id);
  document.getElementById("zones").innerHTML=ZONES.map(zoneCard).join("");
  openIds.forEach(id=>{
    const z=document.getElementById(id);
    if(z){z.classList.add("open");z.querySelector(".zhead").setAttribute("aria-expanded","true");}
  });
}

/* ---------- orientation map ---------- */
const MAPW=760,MAPH=568,LON0=-5.85,LON1=-3.35,LAT0=35.85,LAT1=37.35;
const px=lon=>(lon-LON0)/(LON1-LON0)*MAPW;
const py=lat=>(LAT1-lat)/(LAT1-LAT0)*MAPH;
const COAST=[[-5.85,36.16],[-5.78,36.09],[-5.61,36.00],[-5.44,36.13],[-5.28,36.28],
  [-5.15,36.42],[-4.89,36.51],[-4.62,36.54],[-4.50,36.62],[-4.42,36.72],[-4.28,36.72],
  [-4.10,36.74],[-3.88,36.74],[-3.69,36.72],[-3.52,36.72],[-3.35,36.75]];
const LABPOS={home:[0,24,"middle"],malaga:[13,5,"start"],ronda:[-13,-8,"end"],caminito:[-13,5,"end"],
  granada:[-13,5,"end"],marbella:[13,34,"start"],agua:[-13,6,"end"],axarquia:[0,-15,"middle"],
  antequera:[13,5,"start"],tarifa:[14,5,"start"],genal:[-14,-10,"end"]};
const MAPNAME={home:["Mijas · Basis","Mijas · base"],malaga:["Málaga","Málaga"],ronda:["Ronda","Ronda"],
  caminito:["Caminito","Caminito"],granada:["Granada","Granada"],marbella:["Marbella","Marbella"],
  agua:["Kaltes Wasser","Cold water"],axarquia:["Frigiliana","Frigiliana"],antequera:["Antequera","Antequera"],
  tarifa:["Bolonia","Bolonia"],genal:["Genal-Tal","Genal valley"]};
const DRIVE={home:["Basis","base"],malaga:["35 Min.","35 min"],ronda:["1 Std. 20","1 h 20"],
  caminito:["1 Std. 05","1 h 05"],granada:["1 Std. 50","1 h 50"],marbella:["30 Min.","30 min"],
  agua:["40 Min.","40 min"],axarquia:["1 Std. 25","1 h 25"],antequera:["1 Std.","1 h"],
  tarifa:["1 Std. 40","1 h 40"],genal:["1 Std. 10","1 h 10"]};
const SEA={med:["MITTELMEER","MEDITERRANEAN"],mor:["MAROKKO, 14 KM","MOROCCO, 14 KM"]};

function drawMap(order){
  const place=Object.fromEntries(order.map((r,i)=>[r.id,i]));
  const coast=COAST.map(c=>px(c[0]).toFixed(1)+","+py(c[1]).toFixed(1)).join(" ");
  let s=`<rect class="land" x="0" y="0" width="${MAPW}" height="${MAPH}"/>`;
  s+=`<polygon class="sea" points="${coast} ${MAPW},${MAPH} 0,${MAPH}"/>`;
  s+=`<text class="geo" x="430" y="556">${T(SEA.med)}</text>`;
  s+=`<text class="geo" x="95" y="545">${T(SEA.mor)}</text>`;
  const bx=px(LL.home[1]),by=py(LL.home[0]);
  RANK.forEach(r=>{if(r.id!=="home")
    s+=`<line class="spoke" x1="${bx}" y1="${by}" x2="${px(LL[r.id][1])}" y2="${py(LL[r.id][0])}"/>`;});
  s+=`<g class="base"><rect x="${bx-7}" y="${by-7}" width="14" height="14" rx="2"/></g>`;
  RANK.forEach(r=>{
    const i=place[r.id],c=i<3?"var(--buganvilla)":i<6?"var(--azul)":"var(--stone)";
    const rad=i<3?10:i<6?8:6.5;
    const x=px(LL[r.id][1]),y=py(LL[r.id][0]);
    const [dx,dy,an]=LABPOS[r.id];
    if(r.id!=="home") s+=`<g class="pin" data-z="${r.id}"><circle cx="${x}" cy="${y}" r="${rad}" fill="${c}"/></g>`;
    s+=`<text class="lbl" x="${x+dx}" y="${y+dy}" text-anchor="${an}">${T(MAPNAME[r.id])}</text>`;
    s+=`<text class="sub" x="${x+dx}" y="${y+dy+17}" text-anchor="${an}">${T(DRIVE[r.id])}</text>`;
  });
  document.getElementById("zmap").innerHTML=s;
}

/* ---------- ranking ---------- */
function drawRank(mode){
  sortMode=mode;
  const order=RANK.slice().sort((a,b)=>
    mode==="u"?b.u-a.u||b.e-a.e:
    mode==="e"?b.e-a.e||b.u-a.u:
    mode==="h"?a.h-b.h||(b.u+b.e)-(a.u+a.e):
               (b.u+b.e)-(a.u+a.e)||b.e-a.e);
  document.getElementById("rank").innerHTML=order.map((r,i)=>`
    <li class="${i<3?"tier1":i<6?"tier2":""}">
      <div class="rk">
        <a href="#${r.id}">${T(r.s)}</a>
        <p>${T(r.v)}</p>
        <div class="bars">
          <span class="bar"><span>${T(UI.bUnique)}</span><span class="track"><span class="fill u" style="width:${r.u*10}%"></span></span><b>${r.u}</b></span>
          <span class="bar"><span>${T(UI.bDay)}</span><span class="track"><span class="fill" style="width:${r.e*10}%"></span></span><b>${r.e}</b></span>
          <span class="hrs-chip">${r.h?dec(r.h)+" "+T(UI.hDrive):T(UI.hNone)}</span>
        </div>
      </div>
    </li>`).join("");
  drawMap(order);
}

/* ---------- tables and chrome ---------- */
function drawWeek(){
  document.getElementById("week").innerHTML=WEEK.map(r=>
    `<tr class="${r.anchor?"anchor":""}"><td class="d">${T(r.d)}</td>
     <td class="z"><a href="#${r.zid}">${T(r.z)}</a></td><td class="alt">${T(r.alt)}</td></tr>`).join("");
}
function drawBoard(){
  document.getElementById("board").innerHTML=BOARD.map(r=>
    `<tr><td>${T(r.w)}</td><td class="when">${T(r.when)}</td><td>${T(r.how)}</td></tr>`).join("");
}
function drawDays(){
  document.getElementById("dayrow").innerHTML=
    DAYS.map(d=>`<button class="dbtn" data-day="${d}" aria-pressed="${active===d}">${T(LABEL[d])}</button>`).join("")
    +`<button class="dbtn reset" data-day="" aria-pressed="${active===null}">${T(ALLDAYS)}</button>`;
}
function drawFooter(){
  document.getElementById("footlist").innerHTML=UI.foot.map(f=>`<li>${T(f)}</li>`).join("");
}
function applyUI(){
  document.querySelectorAll("[data-t]").forEach(el=>{
    const v=UI[el.dataset.t]; if(v) el.innerHTML=T(v);
  });
  document.documentElement.lang=LANG===0?"de":"en";
  document.title=T(UI.htmlTitle);
  document.querySelector(".sheet-x").setAttribute("aria-label",T(UI.sheetClose));
}
function renderAll(){
  applyUI(); drawDays(); drawWeek(); drawBoard(); drawFooter();
  drawRank(sortMode); renderZones();
  document.querySelectorAll("#sortrow .dbtn").forEach(b=>
    b.setAttribute("aria-pressed", b.dataset.sort===sortMode));
  document.querySelectorAll("#langrow .dbtn").forEach(b=>
    b.setAttribute("aria-pressed", (b.dataset.lang==="de"?0:1)===LANG));
}
renderAll();

/* ---------- events ---------- */
document.getElementById("langrow").addEventListener("click",e=>{
  const b=e.target.closest("[data-lang]"); if(!b) return;
  LANG=b.dataset.lang==="de"?0:1;
  renderAll();
});
document.getElementById("dayrow").addEventListener("click",e=>{
  const b=e.target.closest(".dbtn"); if(!b) return;
  active=b.dataset.day||null;
  document.querySelectorAll("#dayrow .dbtn").forEach(x=>x.setAttribute("aria-pressed",x===b));
  renderZones();
});
document.getElementById("sortrow").addEventListener("click",e=>{
  const b=e.target.closest("[data-sort]"); if(!b) return;
  document.querySelectorAll("#sortrow .dbtn").forEach(x=>x.setAttribute("aria-pressed",x===b));
  drawRank(b.dataset.sort);
});
document.getElementById("zmap").addEventListener("click",e=>{
  const p=e.target.closest(".pin"); if(!p) return;
  const z=document.getElementById(p.dataset.z);
  if(z){z.classList.add("open");z.querySelector(".zhead").setAttribute("aria-expanded","true");
        z.scrollIntoView({behavior:"smooth",block:"start"});}
});
document.getElementById("rank").addEventListener("click",e=>{
  const a=e.target.closest("a"); if(!a) return;
  const z=document.querySelector(a.getAttribute("href"));
  if(z&&!z.classList.contains("open")){z.classList.add("open");
    z.querySelector(".zhead").setAttribute("aria-expanded","true");}
});
document.getElementById("week").addEventListener("click",e=>{
  const a=e.target.closest("a"); if(!a) return;
  const z=document.querySelector(a.getAttribute("href"));
  if(z&&!z.classList.contains("open")){z.classList.add("open");
    z.querySelector(".zhead").setAttribute("aria-expanded","true");}
});
document.getElementById("copybtn").addEventListener("click",async e=>{
  try{
    await navigator.clipboard.writeText(document.getElementById("es").textContent.trim());
    e.target.textContent=T(UI.copyOk);
    setTimeout(()=>e.target.textContent=T(UI.copyBtn),1800);
  }catch{e.target.textContent=T(UI.copyFail);}
});

/* ---------- map sheet ---------- */
const SHEET=document.getElementById("sheet");
let lastFocus=null;
function openSheet(b){
  const n=b.dataset.n,label=b.dataset.label||n,q=b.dataset.q,tel=b.dataset.tel,url=b.dataset.url;
  const i=INFO[n];
  lastFocus=b;
  document.getElementById("sheetTitle").textContent=label;
  const bits=[];
  if(i&&i[0]) bits.push("★ "+dec(i[0])+" · "+num(i[1])+" "+T(UI.reviews));
  if(i&&i[2]) bits.push("€".repeat(i[2]));
  document.getElementById("sheetSub").textContent=bits.join("  ·  ");
  document.getElementById("sheetFrame").src=
    "https://www.google.com/maps?q="+encodeURIComponent(q)+"&z=16&hl="+(LANG===0?"de":"en")+"&output=embed";
  const acts=[`<a class="primary" href="${url||"https://maps.google.com/?q="+encodeURIComponent(q)}" target="_blank" rel="noopener">${T(UI.sheetOpen)}</a>`,
    `<a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}" target="_blank" rel="noopener">${T(UI.sheetDir)}</a>`];
  if(tel) acts.push(`<a href="tel:${tel}">${T(UI.sheetCall)}</a>`);
  document.getElementById("sheetActs").innerHTML=acts.join("");
  SHEET.hidden=false;
  document.body.classList.add("locked");
  SHEET.querySelector(".sheet-x").focus();
}
function closeSheet(){
  SHEET.hidden=true;
  document.getElementById("sheetFrame").src="about:blank";
  document.body.classList.remove("locked");
  if(lastFocus) lastFocus.focus();
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".mapbtn"); if(b){openSheet(b);return;}
  if(e.target.closest("[data-close]")){closeSheet();return;}
  const h=e.target.closest(".zhead");
  if(h){const open=h.parentElement.classList.toggle("open");h.setAttribute("aria-expanded",open);}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!SHEET.hidden) closeSheet();});
</script>
</body>
