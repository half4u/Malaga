<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijas Basislager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --ink:#0A2540; --azul:#17559B; --buganvilla:#CE2B6D; --sol:#F5B32C;
  --cal:#F6F5F1; --stone:#7C8CA0; --line:#D8D6CE; --shadow:rgba(10,37,64,.14);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{background:var(--cal);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--azul)}
.wrap{max-width:840px;margin:0 auto;padding:0 18px 96px}

.mast{padding:18px 0 20px;border-bottom:2px solid var(--ink)}
.langrow{display:flex;gap:6px;margin:0 0 18px}
.lang{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--ink);background:transparent;color:var(--ink);padding:6px 11px;border-radius:2px;cursor:pointer}
.lang[aria-pressed="true"]{background:var(--ink);color:var(--cal)}
.lang:focus-visible{outline:2px solid var(--buganvilla);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--buganvilla);margin:0 0 10px}
.mast h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,60px);line-height:.94;letter-spacing:-.03em;margin:0 0 14px}
.mast h1 em{font-style:normal;color:var(--azul)}
.mast p{margin:0;max-width:56ch;color:#2C4460}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;margin-top:20px;font-family:var(--mono);font-size:12px;line-height:1.4}
.facts div span{display:block;color:var(--stone);letter-spacing:.08em;text-transform:uppercase;font-size:10px}
@media(min-width:620px){.facts{grid-template-columns:repeat(4,1fr)}}

/* sticky day filter */
.filter{position:sticky;top:0;z-index:30;background:var(--cal);border-bottom:1px solid var(--line);margin:0 -18px;padding:10px 18px 11px}
.filter-lab{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);margin:0 0 7px}
.dayrow{display:flex;gap:5px;flex-wrap:wrap}
.dbtn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:6px 9px;border-radius:2px;cursor:pointer;min-width:42px}
.dbtn[aria-pressed="true"]{background:var(--ink);color:var(--cal)}
.dbtn.reset{border-style:dashed;color:var(--stone);border-color:var(--stone)}
.dbtn:focus-visible{outline:2px solid var(--buganvilla);outline-offset:2px}

h2.sec{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:42px 0 4px}
.sec-note{margin:0 0 18px;color:var(--stone);font-size:14px;max-width:60ch}

/* week grid */
table.week{width:100%;border-collapse:collapse;font-size:14px}
table.week th,table.week td{text-align:left;padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.week th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);font-weight:500}
table.week td.d{font-family:var(--mono);font-size:12px;color:var(--buganvilla);white-space:nowrap;font-weight:500}
table.week td.z{font-weight:600}
table.week td.z a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--buganvilla)}
table.week td.alt{color:var(--stone);font-size:13px}
table.week tr.anchor td{background:#FFFAFC}

/* zone card */
.zone{background:#fff;border:1px solid var(--line);border-radius:3px;margin-bottom:16px;box-shadow:0 1px 0 var(--shadow);overflow:hidden;scroll-margin-top:120px}
.zhead{width:100%;text-align:left;background:none;border:0;padding:18px;cursor:pointer;font:inherit;color:inherit;display:block}
.zhead:focus-visible{outline:2px solid var(--buganvilla);outline-offset:-3px}
.chev{float:right;font-family:var(--mono);font-size:12px;color:var(--stone);transition:transform .18s}
.zone.open .chev{transform:rotate(180deg)}
.zbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px;align-items:center}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:2px;background:#EDEFF3;color:#3A5474}
.badge.anchor{background:#FCEEF3;color:var(--buganvilla)}
.badge.near{background:#E8F1E9;color:#2F6B45}
.badge.count{background:var(--ink);color:var(--cal)}
.zhead h3{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;letter-spacing:-.02em;margin:0 0 6px}
.pitch{margin:0 0 12px;color:#2C4460;font-size:15px}
.metrics{display:flex;gap:16px;font-family:var(--mono);font-size:11px;color:var(--stone);letter-spacing:.04em;flex-wrap:wrap}

.zbody{display:none;padding:0 18px 20px;border-top:1px solid var(--line)}
.zone.open .zbody{display:block}
h4.sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--buganvilla);margin:20px 0 10px;padding-top:14px;border-top:1px dotted var(--line)}
h4.sub:first-child{border-top:0;padding-top:0;margin-top:18px}
h4.sub em{font-style:normal;color:var(--stone);text-transform:none;letter-spacing:0;font-family:var(--body);font-size:12px;margin-left:6px}

ul.sights{list-style:none;margin:0;padding:0}
ul.sights li{padding:10px 0;border-bottom:1px dotted var(--line)}
ul.sights li:last-child{border-bottom:0}
.sname{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sname strong{font-weight:600;font-size:15px}
.hrs{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--stone);text-transform:uppercase}
ul.sights p{margin:3px 0 0;font-size:14px;color:#42596F}
ul.sights a{font-family:var(--mono);font-size:11px;text-decoration:none;border-bottom:1px solid currentColor;display:inline-block;margin-top:5px}

.food{display:grid;gap:10px}
@media(min-width:620px){.food{grid-template-columns:1fr 1fr}}
.pick{border:1px solid var(--line);border-radius:3px;padding:12px;background:#FCFCFA;position:relative}
.pick .tier{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);display:block;margin-bottom:6px}
.pick.splurge{border-color:var(--buganvilla);background:#FFFAFC}
.pick.splurge .tier{color:var(--buganvilla)}
.pick strong{display:block;font-size:15px;font-weight:600;line-height:1.25}
.pick p{margin:5px 0 0;font-size:13.5px;color:#42596F}
.meta{font-family:var(--mono);font-size:11px;color:var(--stone);margin-top:7px;display:block;line-height:1.7}
.meta a{color:var(--azul);text-decoration:none;border-bottom:1px solid var(--line)}
.pick.shut{opacity:.42}
.pick.shut::after{
  content:attr(data-shut);position:absolute;top:10px;right:10px;
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--ink);color:var(--cal);padding:2px 5px;border-radius:2px
}
.warn{background:#FDF2DC;border-left:3px solid var(--sol);padding:10px 12px;font-size:14px;margin:16px 0 0;border-radius:0 2px 2px 0}
.warn strong{font-weight:600}

.panel{background:#fff;border:1px solid var(--line);border-radius:3px;padding:18px;box-shadow:0 1px 0 var(--shadow)}
.panel h3{font-family:var(--display);font-weight:700;font-size:19px;margin:0 0 8px;letter-spacing:-.02em}
.panel p{margin:0 0 12px;font-size:14.5px;color:#2C4460}
ol.plays{margin:0;padding-left:20px;font-size:14.5px}
ol.plays li{margin-bottom:9px;color:#2C4460}
ol.plays b{color:var(--ink)}
table.board{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.board th,table.board td{text-align:left;padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.board th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);font-weight:500}
table.board td.when{font-family:var(--mono);font-size:12px;color:var(--buganvilla);white-space:nowrap}
.copy{border:1px solid var(--ink);border-radius:3px;padding:14px;background:#fff;margin-top:14px}
.copy p{margin:0 0 10px;font-size:14.5px;font-style:italic;color:#243A52}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--cal);border:0;padding:9px 14px;border-radius:2px;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--buganvilla);outline-offset:2px}
footer{margin-top:46px;padding-top:18px;border-top:2px solid var(--ink);font-size:13px;color:var(--stone)}
footer ul{padding-left:18px;margin:8px 0 0}
footer li{margin-bottom:5px}
/* orientation map */
.mapwrap{background:#fff;border:1px solid var(--line);border-radius:3px;box-shadow:0 1px 0 var(--shadow);padding:6px}
.mapscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
#zmap{display:block;width:100%;min-width:600px;height:auto}
#zmap .sea{fill:#DCE6EE}
#zmap .land{fill:#F1EFE8}
#zmap .spoke{stroke:#C3CBD4;stroke-width:1.4;stroke-dasharray:4 4}
#zmap .pin{cursor:pointer}
#zmap .pin circle{stroke:#fff;stroke-width:2.5}
#zmap .pin:hover circle{stroke:var(--ink)}
#zmap .lbl{font-family:"Inter",sans-serif;font-size:19px;font-weight:600;fill:var(--ink);pointer-events:none}
#zmap .sub{font-family:"IBM Plex Mono",monospace;font-size:15px;fill:var(--stone);pointer-events:none}
#zmap .geo{font-family:"IBM Plex Mono",monospace;font-size:15px;fill:#9AAAB8;letter-spacing:.14em;pointer-events:none}
#zmap .base rect{fill:var(--ink);stroke:#fff;stroke-width:2.5}
.maplegend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;
  color:var(--stone);margin-top:9px;letter-spacing:.05em;text-transform:uppercase}
.maplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.maplegend i.sq{border-radius:1px;background:var(--ink)}

/* ranking */
.sortrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
ol.rank{list-style:none;counter-reset:r;margin:0;padding:0}
ol.rank li{counter-increment:r;display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
ol.rank li::before{content:counter(r);font-family:var(--display);font-weight:800;font-size:20px;
  color:var(--line);min-width:26px;line-height:1.1}
ol.rank li.tier1::before{color:var(--buganvilla)}
ol.rank li.tier2::before{color:var(--azul)}
.rk{flex:1;min-width:0}
.rk a{font-weight:600;font-size:16px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.rk a:hover{border-color:var(--buganvilla)}
.rk p{margin:4px 0 8px;font-size:14px;color:#42596F}
.bars{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.bar{display:flex;align-items:center;gap:6px}
.bar span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone)}
.track{width:64px;height:5px;background:#E7E9EC;border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--azul)}
.fill.u{background:var(--buganvilla)}
.bar b{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink)}
.hrs-chip{font-family:var(--mono);font-size:11px;color:var(--stone)}

/* rating + price chips */
.gchips{display:inline-flex;gap:5px;margin-left:7px;vertical-align:baseline}
.gchip{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:none;
  background:#EDEFF3;color:#3A5474;padding:2px 5px;border-radius:2px;white-space:nowrap}
.gchip.star{background:#FDF2DC;color:#7A5200}
.gchip b{font-weight:400;opacity:.62}
.pick.splurge .gchip{background:#FBE7EE;color:#8E1C4B}
.pick.splurge .gchip.star{background:#FDF2DC;color:#7A5200}

/* map button */
.mapbtn{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:1px solid var(--azul);color:var(--azul);
  padding:5px 10px;border-radius:2px;cursor:pointer;margin-top:8px}
.mapbtn:hover{background:var(--azul);color:#fff}
.mapbtn:focus-visible{outline:2px solid var(--buganvilla);outline-offset:2px}
ul.sights .mapbtn{margin-top:7px}

/* bottom sheet */
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-back{position:absolute;inset:0;background:rgba(10,37,64,.55);backdrop-filter:blur(2px)}
.sheet-card{position:relative;background:var(--cal);width:100%;max-width:600px;
  border-radius:6px 6px 0 0;padding:18px;max-height:92vh;overflow-y:auto;
  box-shadow:0 -6px 30px rgba(10,37,64,.3);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:translateY(0);opacity:1}}
@media(min-width:620px){
  .sheet{align-items:center}
  .sheet-card{border-radius:4px;max-height:88vh}
}
.sheet-x{position:absolute;top:12px;right:12px;background:none;border:0;font-size:17px;
  color:var(--stone);cursor:pointer;line-height:1;padding:6px}
.sheet-x:focus-visible{outline:2px solid var(--buganvilla);outline-offset:2px}
.sheet-card h3{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em;
  margin:0 6px 8px 0;padding-right:26px;line-height:1.15}
.sheet-sub{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--buganvilla);margin:0 0 8px}
.sheet-map{position:relative;height:46vh;min-height:240px;background:#E7E9EC;border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:12px 0 10px}
.sheet-map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sheet-acts{display:flex;gap:8px;flex-wrap:wrap}
.sheet-acts a{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:none;padding:9px 13px;border-radius:2px;border:1px solid var(--ink);color:var(--ink)}
.sheet-acts a.primary{background:var(--ink);color:var(--cal)}
.sheet-note{font-size:12px;color:var(--stone);margin:10px 0 0}
body.locked{overflow:hidden}

@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
.filter-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:7px}
.filter-lab{margin:0}
#langrow{gap:4px;flex:0 0 auto}
.dbtn.lang{min-width:36px;padding:5px 8px;font-size:10px}
.facts div em{font-style:normal;display:block}
.maplegend em{font-style:normal}

/* zone hero + food thumbnails */
.zhero{
  height:150px;background-size:cover;background-position:center;
  border-bottom:1px solid var(--line);position:relative
}
.zhero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,37,64,0) 55%,rgba(10,37,64,.32) 100%)
}
.pick{padding:0}
.pick-img{
  height:86px;background-size:cover;background-position:center;
  border-radius:3px 3px 0 0;background-color:#E7E9EC
}
.pick .tier,.pick p,.pick strong,.pick .meta,.pick .mapbtn{margin-left:12px;margin-right:12px}
.pick .tier{display:block;margin-top:10px}
.pick .mapbtn{margin-bottom:12px;margin-top:8px}
.pick > strong{margin-top:2px}
.photo-credit{font-family:var(--mono);font-size:10px;color:var(--stone);margin-top:6px;letter-spacing:.03em}
</style>
</head>
<body>
<div class="wrap">

<header class="mast">
  <p class="eyebrow" data-t="eyebrow"></p>
  <h1 data-t="h1"></h1>
  <p data-t="intro"></p>
  <div class="facts">
    <div><span data-t="fBase"></span><em data-t="fBaseV"></em></div>
    <div><span data-t="fIn"></span><em data-t="fInV"></em></div>
    <div><span data-t="fOut"></span><em data-t="fOutV"></em></div>
    <div><span data-t="fSun"></span><em data-t="fSunV"></em></div>
  </div>
</header>

<div class="filter">
  <div class="filter-top">
    <p class="filter-lab" data-t="filterLab"></p>
    <div class="dayrow" id="langrow">
      <button class="dbtn lang" data-lang="de" aria-pressed="true">DE</button>
      <button class="dbtn lang" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="dayrow" id="dayrow"></div>
</div>

<h2 class="sec" data-t="secMap"></h2>
<p class="sec-note" data-t="noteMap"></p>
<div class="mapwrap"><div class="mapscroll"><svg id="zmap" viewBox="0 0 760 568" role="img" aria-label="Karte"></svg></div></div>
<div class="maplegend">
  <span><i style="background:var(--buganvilla)"></i><em data-t="legTop"></em></span>
  <span><i style="background:var(--azul)"></i><em data-t="legMid"></em></span>
  <span><i style="background:var(--stone)"></i><em data-t="legLow"></em></span>
  <span><i class="sq"></i><em data-t="legHouse"></em></span>
</div>

<h2 class="sec" data-t="secWeek"></h2>
<p class="sec-note" data-t="noteWeek"></p>
<table class="week">
  <thead><tr><th data-t="thDay"></th><th data-t="thZone"></th><th data-t="thAlt"></th></tr></thead>
  <tbody id="week"></tbody>
</table>

<h2 class="sec" data-t="secRank"></h2>
<p class="sec-note" data-t="noteRank"></p>
<div class="sortrow" id="sortrow">
  <button class="dbtn" data-sort="overall" aria-pressed="true" data-t="sOverall"></button>
  <button class="dbtn" data-sort="u" aria-pressed="false" data-t="sUnique"></button>
  <button class="dbtn" data-sort="e" aria-pressed="false" data-t="sExp"></button>
  <button class="dbtn" data-sort="h" aria-pressed="false" data-t="sHours"></button>
</div>
<ol class="rank" id="rank"></ol>

<h2 class="sec" data-t="secZones"></h2>
<p class="sec-note" data-t="noteZones"></p>
<div id="zones"></div>

<h2 class="sec" data-t="secAlh"></h2>
<div class="panel">
  <h3 data-t="alhH"></h3>
  <p data-t="alhP"></p>
  <ol class="plays">
    <li data-t="alh1"></li>
    <li data-t="alh2"></li>
    <li data-t="alh3"></li>
  </ol>
  <p style="margin-bottom:0" data-t="alhEnd"></p>
</div>

<h2 class="sec" data-t="secBoard"></h2>
<table class="board">
  <thead><tr><th data-t="thWhat"></th><th data-t="thPrio"></th><th data-t="thHow"></th></tr></thead>
  <tbody id="board"></tbody>
</table>

<div class="copy">
  <p id="es">Buenas tardes. Quería reservar una mesa para cuatro personas el viernes a las 21:00, a nombre de Marko. ¿Tienen disponibilidad? Muchas gracias.</p>
  <button class="btn" id="copybtn" data-t="copyBtn"></button>
</div>

<footer>
  <strong data-t="footH"></strong>
  <ul id="footlist"></ul>
</footer>

</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-back" data-close></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <button class="sheet-x" data-close aria-label="Karte schließen">✕</button>
    <p class="sheet-sub" id="sheetSub"></p>
    <h3 id="sheetTitle"></h3>
    <div class="sheet-map"><iframe id="sheetFrame" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
    <div class="sheet-acts" id="sheetActs"></div>
    <p class="sheet-note" data-t="sheetNote"></p>
  </div>
</div>

<script>
/* Every user-facing string is [Deutsch, English]. A plain string means it is
   identical in both. T() picks the current language. */
let LANG = 0;               // 0 = de, 1 = en
const T = v => Array.isArray(v) ? v[LANG] : v;

const UI = {
  htmlTitle:["Mijas Basislager · Zonen, Optionen, Ruhetage","Mijas Base Camp · zones, options, closing days"],
  eyebrow:["Mijas Pueblo · Mo 27. Juli → Mo 3. Aug · 4 Personen · 1 Auto","Mijas Pueblo · Mon 27 Jul → Mon 3 Aug · 4 pax · 1 car"],
  h1:["Elf Zonen.<br>Eine pro Tag.<br><em>Vorher Ruhetage prüfen.</em>","Eleven zones.<br>Pick one a day.<br><em>Check what's open first.</em>"],
  intro:["Ankunft um 08:45 schenkt euch einen ganzen Tag, Abflug um 09:20 nimmt euch den letzten wieder weg. Bleiben sechseinhalb nutzbare Tage für elf Zonen, also ist das hier eine Karte und kein Fahrplan. Alles ist bewertet, kartiert und nach Art der Küche sortiert statt nach Preis, mit sämtlichen Ruhetagen.",

     url:"https://maps.google.com/?q=Los+Marinos+Jose+Fuengirola"},
    {n:["Freiduría El Cenachero","Freiduría El Cenachero"], tier:"street", closed:["mon"],

    {n:["Tomillo Limón","Tomillo Limón"], tier:"mid", closed:["mon","sun"],

{
  id:"malaga", name:["Málaga Stadt","Málaga city"], drive:["~35 Min.","~35 min"],
  dist:["~35 km über die AP-7","~35 km on the AP-7"], tags:["anchor"],
  when:["Jeder Tag außer Sonntag, dann ist der Markt zu.","Any day except Sunday, when the market shuts."],
  pitch:["Fischmarkt um zehn Uhr morgens mit einem Bier, eine maurische Festung auf dem Hügel, Picasso an seinem Geburtsort, und das beste günstige Essen der Woche. Die Zone mit den meisten Optionen und der kürzesten Fahrt.",
         "Fish market at ten in the morning with a beer, a Moorish fortress on the hill, Picasso where he was born, and the best cheap eating of the week. This is the zone with the most options and the least driving."],
  trap:["Mercado Atarazanas ist 09:00–14:00 und sonntags zu. Die Alcazaba schließt um 18:00. Einmal in einer Tiefgarage im Zentrum parken und alles laufen, die Altstadt ist klein.",
        "Mercado Atarazanas is 09:00–14:00 and closed Sunday. The Alcazaba shuts at 18:00. Park in a centro underground car park once and walk everything; the old town is small."],
  sights:[

        "Iron and glass hall built around a surviving Nasrid marble gate. Buy jamón, turrón, saffron and spices inside, then eat fried fish and prawns standing at the stalls outside. Cash is faster."],
     url:"https://maps.google.com/?q=Mercado+de+Atarazanas+Malaga"},
    {n:["Alcazaba","Alcazaba"], h:"7,50 € · 09:00–18:00",

        "About an hour, steep and uneven. Upper terraces give you the port, the coast and the Roman theatre below. 4.6 from 40,000 people and worth every one of them."],
     url:"https://maps.google.com/?q=Alcazaba+Malaga"},
    {n:["Castillo de Gibralfaro","Castillo de Gibralfaro"], h:"3,50 €",

     url:"https://maps.google.com/?q=Castillo+de+Gibralfaro"},
    {n:["Museo Picasso Málaga","Museo Picasso Málaga"], h:"~12 €",

    {n:["Centre Pompidou Málaga","Centre Pompidou Málaga"], h:"~9 €",

     url:"https://maps.google.com/?q=Centre+Pompidou+Malaga"},
    {n:["Pedregalejo und El Palo","Pedregalejo and El Palo"], h:["gratis","free"],

        "Plaza de las Flores. Modern tapas, roast chicken with couscous, guacamole with chipotle mayo. Some say a touch salty; the terrace makes up for it."],
     meta:"12:30–23:30 · +34 952 60 96 62",
     url:"https://maps.google.com/?q=Kraken+Centro+Malaga"},
    {n:["Espeto de sardinas, Pedregalejo","Espeto de sardinas, Pedregalejo"], tier:"street", closed:[],

{
  id:"ronda", name:["Ronda und die Serranía","Ronda and the Serranía"], drive:["~1 Std. 20","~1 h 20"],
  dist:["~95 km über die A-397","~95 km via the A-397"], tags:["anchor"],
  when:["Mi, Do oder Fr, falls ihr Bardal wollt. So oder so vor 08:00 los.","Wed, Thu or Fri if you want Bardal. Out by 08:00 either way."],
  pitch:["Eine Stadt, die eine 120 m tiefe Schlucht teilt, ein Dorf unter einem überhängenden Felsen, römische Ruinen, die niemand besucht, und das beste Doppel-Essen der Woche: eine Tapas-Bar für 1,50 € mit 6.000 Bewertungen und ein Zwei-Sterne-Menü, neun Gehminuten auseinander, jedes für sich die Fahrt wert.",
         "A town split by a 120 m gorge, a village wedged under an overhanging cliff, Roman ruins nobody visits, and the best two-in-one eating of the week: a €1.50 tapas bar with 6,000 reviews and a two star tasting menu, nine minutes apart, each worth the drive on its own."],
  trap:["Bardal serviert nur Mittwoch bis Freitag. In Setenil macht Bar Frasquito meist um 17:00 zu, und beide Lokale in der Felsengasse haben dienstags Ruhetag. Ronda um 15:00 im August sind 38 Grad, also nur vormittags.",
        "Bardal serves Wednesday to Friday only. In Setenil, Bar Frasquito shuts at 17:00 most days and both cave-street places close Tuesday. Ronda at 15:00 in August is 38 °C, so mornings only."],
  sights:[
    {n:["Puente Nuevo und Alameda del Tajo","Puente Nuevo and Alameda del Tajo"], h:["gratis","free"],
     d:["Über die Brücke laufen, bevor die Busse kommen, dann auf die Klippenterrasse der Alameda, wo es senkrecht in die Serranía hinuntergeht.",
        "Walk the bridge before the coaches land, then the cliff terrace where the drop goes straight down into the Serranía."],
     url:"https://maps.google.com/?q=Puente+Nuevo+Ronda"},
    {n:["Plaza de Toros","Plaza de Toros"], h:"~9 €",
     d:["Spaniens älteste Stierkampfarena, dazu Museum und Stallungen. Zwanzig Minuten, wenn es euch nicht besonders interessiert.",

     url:"https://maps.google.com/?q=Plaza+de+Toros+Ronda"},
    {n:["Baños Árabes","Baños Árabes"], h:"~5 €",
     d:["Arabische Bäder aus dem 13. Jahrhundert unten in der Schlucht, die besterhaltenen Spaniens, und drinnen kühl in jeder Hinsicht.",
        "Thirteenth century Arab baths at the bottom of the gorge, the best preserved in Spain, and cool inside in both senses."],
     url:"https://maps.google.com/?q=Baños+Arabes+Ronda"},
    {n:["Die andere Seite der Schlucht","The far side of the gorge"], h:["gratis","free"],
     d:["Über die Brücke und durch die Gassen auf der Südseite. Fast niemand macht das, und dort fühlt sich die Stadt noch wie eine Stadt an.",
        "Cross the bridge and walk the lanes on the south side. Almost nobody does, and it is where the town still feels like a town."]},
    {n:["Setenil de las Bodegas","Setenil de las Bodegas"], h:["gratis · 30 Min. von Ronda","free · 30 min from Ronda"],

    {n:["Bardal · zwei Michelin-Sterne","Bardal · two Michelin stars"], tier:"splurge", closed:["mon","tue","sat","sun"],

     meta:"11:30–23:30 · +34 666 21 94 62",
     url:"https://maps.google.com/?q=Restaurante+Las+Maravillas+Ronda"},

        "In the cave street itself, under the rock. Iberian mixed grill for two that feeds four, ham croquetas, huge portions, about €35 with sangria. Closes 17:00 except Friday and Saturday."],

        "€10 official tickets sell out weeks ahead in July and it is closed Mondays. No shade at all on the boardwalk. Children under eight are not allowed."],
  sights:[
    {n:["Der Steg selbst","The walkway itself"], h:["10 € · 2–3 Std.","€10 · 2–3 h"],
     d:["Am Nordzugang bei Ardales parken, den Shuttle für 2,50 € nehmen, 30 Minuten vor dem Zeitfenster am Tor sein. Helme werden ausgegeben, Einbahnstrecke, Ausstieg in El Chorro. Turnschuhe, Hut, zwei Liter Wasser pro Person.",
        "Park at the north access near Ardales, take the €2.50 shuttle, be at the gate 30 minutes before your slot. Helmets handed out, one way route, exit at El Chorro. Trainers, hat, two litres of water each."],
     url:"https://maps.google.com/?q=El+Caminito+del+Rey+Ardales"},
    {n:["Die Guadalhorce-Seen","Guadalhorce lakes"], h:["gratis","free"],
     d:["Zehn Minuten vom Ausstieg. Drei Stauseen, türkis, weitgehend leer, und der Grund, Handtücher mitzunehmen.",
        "Ten minutes from the exit. Three reservoirs, turquoise, largely empty, and the reason to bring towels."],
     url:"https://maps.google.com/?q=Embalse+del+Conde+de+Guadalhorce"},
    {n:["Mirador del Gaitanejo","Mirador del Gaitanejo"], h:["gratis","free"],
     d:["Aussichtspunkt an der Straße über den Staudamm und den Eingang zur Schlucht. Zwei Minuten, lohnt den Halt.",
        "Roadside viewpoint over the dam and the entrance to the gorge. Two minutes, worth stopping."]},
    {n:["Bobastro","Bobastro"], h:"~3 €",
     d:["Reste einer Rebellenfestung aus dem neunten Jahrhundert im Fels über El Chorro, samt einer direkt aus der Klippe geschlagenen Kirche. Zehn Minuten vom Ausstieg und fast niemand geht hin.",
        "Ruins of a ninth century rebel stronghold carved into the rock above El Chorro, including a church cut straight out of the cliff. Ten minutes from the exit and almost nobody goes."]},
    {n:["Álora","Álora"], h:["gratis","free"],
     d:["Weißes Städtchen mit Burg auf dem Rückweg, und Ventas an der Straße mit Menú del día für 12–15 € bis etwa 15:30.",
        "White town with a castle on the way home, and ventas along the road doing menú del día for €12–15 until about 15:30."],
     url:"https://maps.google.com/?q=Alora+Malaga"}
  ],
  food:[
    {n:["El Kiosco, El Chorro","El Kiosco, El Chorro"], tier:"street", closed:[],
     d:["An der Shuttle-Haltestelle beim Ausstieg. Kein Ziel für sich, aber kaltes Bier und ein Teller in dem Moment, in dem ihr fertig seid, und genau das wollt ihr dann.",
        "At the shuttle stop by the exit. Not a destination, but cold beer and a plate of something the moment you finish, which is exactly what you will want."],
     url:"https://maps.google.com/?q=El+Kiosko+El+Chorro"},
    {n:["Ventas rund um Álora und Ardales","Ventas around Álora and Ardales"], tier:"street", closed:[],
     d:["Menú del día an der Landstraße, 12–15 € für drei Gänge und Wein, serviert bis etwa 15:30. Nichts zu reservieren, nichts Berühmtes. Das richtige Essen nach der Schlucht.",
        "Roadside menú del día, €12–15 for three courses and wine, served until about 15:30. Nothing to book and nothing famous. The correct post-gorge lunch."]},
    {n:["Den Abend fürs Dorf aufheben","Save the evening for the village"], tier:"mid", closed:[],
     d:["Ihr seid vor dem Mittagessen 8 km in der Hitze gelaufen. Reserviert Koco oder Pampa in Mijas für 21:00 und schreibt den Nachmittag am Pool ab.",
        "You will have walked 8 km in the heat before lunch. Book Koco or Pampa in Mijas for 21:00 and write the afternoon off to the pool."]}
  ]
},
{
  id:"granada", name:["Granada und die Alhambra","Granada and the Alhambra"], drive:["~1 Std. 50","~1 h 50"],
  dist:["~155 km über A-45 und A-92","~155 km via the A-45 and A-92"], tags:["anchor"],
  when:["Di bis Sa für den Nachtbesuch. Nach dem Mittagessen in Mijas los.","Tue to Sat for a night visit. Leave Mijas after lunch."],
  pitch:["Um 14:30 losfahren, dann frisst die Fahrt die schlimmste Hitze des Tages. Albaicín, sobald die Gassen im Schatten liegen, die Alhambra angestrahlt von der anderen Talseite, gratis Tapas weil das hier Gesetz ist, und um 22:00 in den Palästen ohne Schlange.",
         "Leave at 14:30 so the drive eats the worst heat of the day. Albaicín once the lanes go into shade, the Alhambra floodlit from across the valley, free tapas because that is the local law, and the palaces at 22:00 with no queue."],
  trap:["Nachtbesuche laufen Dienstag bis Samstag, 22:00–23:30. In die Nasridenpaläste müsst ihr innerhalb von 30 Minuten nach der Uhrzeit auf dem Ticket hinein, Zuspätkommer werden abgewiesen. Klärt vorher, ob jemand um Mitternacht nach Hause fährt oder ihr eine Hotelnacht bucht.",
        "Night visits run Tuesday to Saturday, 22:00–23:30. You must enter the Nasrid Palaces within 30 minutes of the time on the ticket and latecomers are refused. Decide in advance whether someone drives home at midnight or you book a hotel night."],
  sights:[
    {n:["Nasridenpaläste, Nachtbesuch","Nasrid Palaces, night visit"], h:["~9 € · 22:00–23:30 · Di–Sa","~€9 · 22:00–23:30 · Tue–Sat"],
     d:["Geschnitzter Stuck und geometrische Decken in warmem Licht, bei einem Bruchteil der Menschen. Steht 20 Minuten vorher mit Pässen in der Schlange.",
        "Carved stucco and geometric ceilings under warm light, in a fraction of the crowd. Be in the queue 20 minutes early with passports."],
     url:"https://maps.google.com/?q=Alhambra+Granada"},
    {n:["Mirador de San Nicolás","Mirador de San Nicolás"], h:["gratis","free"],
     d:["Der Blick: Alhambra gegenüber, Sierra Nevada dahinter, Sonnenuntergang gegen 21:20 und direkt danach die Flutlichter. Voll, mit Gitarrist. Trotzdem hin, mit dem Taxi hoch und zu Fuß zurück.",
        "The view: Alhambra opposite, Sierra Nevada behind it, sunset about 21:20 and floodlights straight after. Packed, with a guitarist. Go anyway, and taxi up then walk down."],
     url:"https://maps.google.com/?q=Mirador+de+San+Nicolás+Granada"},
    {n:["Albaicín","Albaicín"], h:["gratis","free"],
     d:["Das alte maurische Viertel auf einem Straßengrundriss, der älter ist als die Reconquista. Ummauerte Gärten, Zisternen, Gassen schmal genug, um im Schatten zu bleiben. Zieht etwas an, worin ihr klettern könnt.",
        "The old Moorish quarter on a street plan that predates the reconquest. Walled gardens, cisterns, lanes narrow enough to stay shaded. Wear something you can climb in."]},
    {n:["Generalife und Alcazaba","Generalife and Alcazaba"], h:"~10–13 €",
     d:["Die Gärten des Sommerpalasts und die Festung. Länger verfügbar als das Gesamtticket, also die Rückfalloption, die euch trotzdem hinter die Mauern bringt.",
        "The summer palace gardens and the fortress. Sells out later than the general ticket, so this is the fallback that still gets you inside the walls."],
     url:"https://maps.google.com/?q=Generalife+Granada"},
    {n:["Capilla Real und die Alcaicería","Capilla Real and the Alcaicería"], h:"~6 €",
     d:["Das Grab von Ferdinand und Isabella, dann die engen Seidenmarktgassen neben der Kathedrale. Gut für den Samstagvormittag vor der Rückfahrt.",
        "Ferdinand and Isabella's tomb, then the narrow silk market lanes beside the cathedral. Good Saturday morning before the drive back."]},
    {n:["Sacromonte","Sacromonte"], h:["gratis · Höhlen ~5 €","free · caves ~€5"],
     d:["Höhlenhäuser am Hang hinter dem Albaicín, und der Flamenco ist hier das Original statt der Küstenversion. Die Zambra-Vorstellungen beginnen spät.",
        "Cave houses on the hill beyond the Albaicín, and the flamenco is the real thing rather than the coastal version. Zambra shows start late."]},
    {n:["Parkhaus Indigo, Alhambra","Parking Indigo, Alhambra"], h:["~10 € / 4 Std. · 24 h","~€10 / 4 h · 24 h"],
     d:["Die ganze Nacht offen, wenige Minuten vom Eingang. Einmal parken, mit dem Taxi runter in den Albaicín, später zu Fuß oder per Taxi hoch zum Nachttermin.",
        "Open all night, minutes from the monument entrance. Park once, taxi down to the Albaicín, walk or taxi back up for the night slot."],
     url:"https://maps.google.com/?q=Parking+Indigo+Granada+Alhambra"}
  ],
  food:[
    {n:["Bar La Riviera","Bar La Riviera"], tier:"street", closed:[],
     d:["Calle Cetti Meriem nahe der Plaza Nueva. Ein Tinto de verano bestellen, gratis Tapa bekommen, wiederholen, und ihr habt zu Abend gegessen. 13.000 Bewertungen bei 4,5. Am Tresen besser als am Tisch.",
        "Calle Cetti Meriem near Plaza Nueva. Order a tinto de verano, get a free tapa, repeat, and you have had dinner. 13,000 reviews at 4.5. Better at the bar than at a table."],
     meta:["12:30–24:00 täglich","12:30–24:00 daily"],
     url:"https://maps.google.com/?q=Bar+La+Riviera+Granada"},
    {n:["La Buena Vida","La Buena Vida"], tier:"street", closed:[],
     d:["Um die Ecke in der Calle Almireceros. Großzügige Gratis-Tapas, die ihr von einer Liste wählt, Albóndigas als Ausreißer nach oben, schnell auch wenn voll. Ideal, wenn ihr um 22:00 einen Termin habt.",
        "Round the corner on Calle Almireceros. Generous free tapas you pick off a list, albóndigas the standout, fast even when full. Ideal when you have a 22:00 slot to make."],
     meta:["12:00–24:00 täglich · +34 654 63 57 97","12:00–24:00 daily · +34 654 63 57 97"],
     url:"https://maps.google.com/?q=La+Buena+Vida+Granada"},
    {n:["Bar Ávila","Bar Ávila"], tier:"street", closed:["sun"],
     d:["Die Schlange bildet sich vor der Öffnung um 20:00. Gebratener Jamón, Dornhai, frittiertes Iberico-Schwein, und ihr dürft die Gratis-Tapa selbst wählen. Sonntag zu.",
        "Queue forms before the 20:00 opening. Roast jamón, dogfish, fried Iberian pork, and they let you choose the free tapa. Closed Sunday."],
     meta:"12:00–17:00, 20:00–24:00",
     url:"https://maps.google.com/?q=Bar+Avila+Tapas+Granada"},
    {n:["Restaurante Carmen El Agua","Restaurante Carmen El Agua"], tier:"splurge", closed:[],
     d:["Terrasse im Albaicín mit der angestrahlten Alhambra davor, und Essen, das sich nicht auf die Aussicht verlässt. Oktopus-Carpaccio, Thunfischbauch. Für einen Terrassentisch weit vorher reservieren. Die Wahl, falls ihr kein Nachtticket bekommt.",
        "Albaicín terrace with the Alhambra floodlit in front of you, and food that does not coast on the view. Octopus carpaccio, tuna belly. Book well ahead for a terrace table. The choice if you end up without a night ticket."],
     meta:"13:00–16:00, 20:00–23:30 · +34 958 22 43 56",
     url:"https://maps.google.com/?q=Restaurante+Carmen+El+Agua+Granada"},
    {n:["El Rincón de Julio","El Rincón de Julio"], tier:"mid", closed:[],
     d:["Calle Navas. 4,9 aus 5.500 Bewertungen, Rabo de toro, das vom Knochen fällt, Kroketten nach Schwiegermutterart. Winzig, also per WhatsApp reservieren.",
        "Calle Navas. 4.9 from 5,500 people, rabo de toro off the bone, mother in law's croquetas. Tiny, so reserve by WhatsApp."],
     meta:"+34 615 13 29 30",
     url:"https://maps.google.com/?q=El+Rincón+de+Julio+Granada"},
    {n:["La Telefónica","La Telefónica"], tier:"mid", closed:[],
     d:["Calle Salamanca. 4,9 aus 11.000 Bewertungen, andalusische Klassiker, Torreznos und iberische Rippchen, und Außentische, für die sich Reservieren lohnt.",
        "Calle Salamanca. 4.9 from 11,000 reviews, Andalusian classics, torreznos and Iberian ribs, outdoor tables worth reserving for."],
     meta:["13:00–24:00 täglich · +34 958 25 62 20","13:00–24:00 daily · +34 958 25 62 20"],
     url:"https://maps.google.com/?q=La+Telefónica+Granada"}
  ]
},
{
  id:"marbella", name:["Marbella und die Westküste","Marbella and the west coast"], drive:["~30 Min.","~30 min"],
  dist:"~30 km", tags:[],
  when:["Abends. Hier wird um 15:00 nichts besser.","Evenings. Nothing here improves at 15:00."],
  pitch:["Die Altstadt hat mit dem Ruf fast nichts zu tun: Orangenbäume, ein Platz aus dem 16. Jahrhundert und Gassen, die eine Stunde wert sind. Dazu die höchste Dichte ernsthafter Küchen in der Region und Strandbars, die ein Drittel dessen kosten, was ihr erwartet.",
         "The old town has almost nothing to do with the reputation: orange trees, a 16th century square, and lanes worth an hour. Then the highest concentration of serious kitchens in the region, and beach bars that cost a third of what you expect."],
  trap:["Mit dem Tisch bei Zafir sind die vier Küchenchef-Lokale unten Ersatz statt Plan. Candeal und Skina haben sonntags zu, Candeal zusätzlich montags. In der Tiefgarage an der Plaza de los Naranjos parken und laufen, Autofahren in der Altstadt bringt nichts.",
        "With Zafir booked, the four chef-led rooms below are spares rather than plans. Candeal and Skina both close Sunday, Candeal also Monday. Park in the Plaza de los Naranjos underground and walk; driving the old town is pointless."],
  sights:[
    {n:["Plaza de los Naranjos und die Altstadt","Plaza de los Naranjos and the old town"], h:["gratis","free"],
     d:["Orangenbäume, ein Platz aus dem 16. Jahrhundert, und die Gassen drumherum schlagen die Marina in jeder Hinsicht.",
        "Orange trees, a 16th century square, and the lanes around it beat the marina in every respect."],
     url:"https://maps.google.com/?q=Plaza+de+los+Naranjos+Marbella"},
    {n:["Paseo Marítimo bis Puerto Banús","Paseo Marítimo to Puerto Banús"], h:["gratis","free"],
     d:["Sieben flache Kilometer Promenade, falls jemand laufen will, und am anderen Ende einiges an Komik.",
        "Seven flat kilometres of promenade if anyone wants the walk, and a fair amount of comedy at the far end."]},
    {n:["Altstadt von Estepona","Estepona old town"], h:["gratis · +25 Min.","free · +25 min"],
     d:["Blumenübersäte Gassen, ein wirklich guter Orchideengarten und deutlich weniger Leute als in Marbella. Die bessere Wahl, wenn die Gruppe hübsch statt lebhaft will.",
        "Flower-covered streets, a genuinely good orchid house, and far fewer people than Marbella. The better option if the group wants pretty rather than lively."],
     url:"https://maps.google.com/?q=Estepona+old+town"},
    {n:["Ojén und Refugio de Juanar","Ojén and Refugio de Juanar"], h:["gratis","free"],
     d:["Fünfzehn Minuten hinauf in die Sierra Blanca hinter Marbella. Kiefernwald, kühlere Luft und ein Aussichtspunkt über die ganze Küste.",
        "Fifteen minutes up into the Sierra Blanca behind Marbella. Pine forest, cooler air, and a viewpoint over the whole coast."],
     url:"https://maps.google.com/?q=Refugio+de+Juanar"},
    {n:["Casares","Casares"], h:["gratis · ~1 Std. von Mijas","free · ~1 h from Mijas"],
     d:["Weißes Dorf, gestapelt an einer Felswand unter einer maurischen Burg, mit Blick auf die Meerenge und an klaren Morgen bis Afrika. Unten parken und laufen, die Straßen sind brutal.",
        "White village stacked up a rock face under a Moorish castle, with the Strait and Africa visible on a clear morning. Park at the bottom and walk; the streets are brutal."],
     url:"https://maps.google.com/?q=Castillo+de+Casares"},
    {n:["Gibraltar","Gibraltar"], h:["Pässe · ~1 Std. 10","passports · ~1 h 10"],
     d:["Ein halber Tag für sich, kein Anhängsel. Rechnet mit Stau an der Grenze, und die Affen beißen.",
        "A half day on its own rather than an add on. Expect a border queue and remember the apes bite."]}
  ],
  food:[
    {n:["Chiringuito Basilio","Chiringuito Basilio"], tier:"street", closed:[],
     d:["Playa de la Fontanilla. Fritura malagueña, Venusmuscheln in einer Sauce, die man auftunken muss, große Garnelen vom Holzkohlegrill. Täglich bis 23:15 und bepreist wie eine Strandbar, nicht wie Marbella.",
        "Playa de la Fontanilla. Fritura malagueña, clams in a sauce worth mopping up, big prawns off the charcoal. Open daily until 23:15, priced like a beach bar rather than like Marbella."],
     meta:"12:00–23:15 · +34 952 86 54 95",
     url:"https://maps.google.com/?q=Chiringuito+Basilio+Marbella"},
    {n:["Candeal","Candeal"], tier:"splurge", closed:["mon","sun"],
     d:["Nur Menü, 4,9 aus knapp 300 Bewertungen, noch kein Stern und offensichtlich unterwegs dorthin. Wachtel mit Toffee-Popcorn-Sauce, Speck mit Erdbeeren, Weinbegleitung, die sich selbst erklärt. Sitzungen ab 19:00.",
        "Tasting menu only, 4.9 from close to 300 reviews, no star yet and obviously coming. Quail with toffee popcorn sauce, bacon with strawberries, wine pairings that explain themselves. Sittings from 19:00."],
     meta:"19:00–22:00 · +34 608 88 80 06",
     url:"https://maps.google.com/?q=Restaurante+Candeal+Marbella"},
    {n:["Restaurante Skina · zwei Sterne","Restaurante Skina · two stars"], tier:"splurge", closed:["sun"],
     d:["Mitten in der Altstadt. Nur Menü, ab etwa 300 € pro Person. Ein paar Bewertungen mäkeln über den Verkaufsdruck; die Küche steht nicht zur Debatte.",
        "In the old town itself. Tasting only, from around €300 a head. A few reviewers grumble about the upsell; the cooking is not in question."],
     meta:"18:30–24:00 · +34 604 48 63 03",
     url:"https://maps.google.com/?q=Restaurante+Skina+Marbella"},
    {n:["Messina","Messina"], tier:"splurge", closed:["tue","sun"],
     d:["Ein Stern, kleiner Raum, kreativ ohne prätentiös zu sein, und ein Service, den Stammgäste namentlich erwähnen. Dienstag und Sonntag zu.",
        "One star, small room, creative without being pretentious, and front of house that regulars name in reviews. Closed Tuesday and Sunday."],
     meta:"19:00–22:00 · +34 952 86 48 95",
     url:"https://maps.google.com/?q=Messina+Restaurante+Marbella"},
    {n:["El Lago","El Lago"], tier:"splurge", closed:["mon"],
     d:["Ein Stern, Tische an einem künstlichen See, saisonale Menüs und Events zur Thunfischsaison. Terrasse den ganzen Sommer offen, und weniger förmlich als die anderen drei.",
        "One star, tables beside an artificial lake, seasonal menus and tuna season events. Terrace open through summer, and less formal than the other three."],
     meta:"12:00–17:30, 19:00–24:00 · +34 952 83 23 71",
     url:"https://maps.google.com/?q=Restaurante+El+Lago+Marbella"},
    {n:["Trocadero Playa","Trocadero Playa"], tier:"mid", closed:[],
     d:["Beachclub mit Luxusschlagseite nahe Puente Romano. Wolfsbarsch in der Salzkruste und Gazpacho sind die Treffer, der Oktopus ist Glückssache. Für die Lage teurer als fürs Essen.",
        "Beach club with a luxury tilt near Puente Romano. Salt crust sea bream and gazpacho are the picks; the octopus is a lottery. Pricier for the location than the food."],
     meta:"10:00–24:00 · +34 610 70 41 44",
     url:"https://maps.google.com/?q=Trocadero+Playa+Marbella"}
  ]
},
{
  id:"agua", name:["Kaltes Wasser: Istán und Benahavís","Cold water: Istán and Benahavís"],
  drive:["35–50 Min.","35–50 min"], dist:"~45 km", tags:["near"],
  when:["Der 38-Grad-Tag. Bis 09:15 geparkt, besonders am Wochenende.","The 38 °C day. Parked by 09:15, especially at weekends."],
  pitch:["Die eine Zone, in der die Hitze für euch arbeitet. Zwei Flussschluchten mit kalten Felsbecken, und ein Bergdorf, das im Kern eine Ansammlung von Restaurants mit angeschlossenen Häusern ist.",
         "The one zone where the heat works for you. Two river gorges with cold rock pools, and a mountain village that is essentially a set of restaurants with houses attached."],
  trap:["Lasst nichts im Auto am Flussparkplatz von Benahavís, die Bewertungen sind da eindeutig. Los Abanicos hat Montag und Dienstag zu, Sabor Mittwoch und Sonntag, Karas Montag.",
        "Do not leave anything in the car at the Benahavís river car park; the reviews are consistent about thieves. Los Abanicos closes Monday and Tuesday, Sabor closes Wednesday and Sunday, Karas closes Monday."],
  sights:[
    {n:["Charco de las Mozas, Benahavís","Charco de las Mozas, Benahavís"], h:["gratis","free"],
     d:["Kostenlos parken außerhalb des Dorfs, etwa 1 km auf dem Gehweg, dann durch ein Tor im Zaun. Sprungstellen, glatter rutschiger Fels, und ihr könnt so weit flussaufwärts weiterlaufen, wie es Spaß macht. Schuhe, die nass werden dürfen.",
        "Free parking outside the village, about 1 km on the pavement, then through a gate in the fence. Jumping spots, slippery smooth rock, and you can keep walking up the riverbed for as long as anyone is enjoying it. Shoes you can soak."],
     url:"https://maps.google.com/?q=Charco+de+las+Mozas+Benahavis"},
    {n:["Charco del Canalón, Istán","Charco del Canalón, Istán"], h:["gratis","free"],
     d:["Drei Kilometer einfacher Weg ab dem Parkplatz, etwa 30 Minuten zu Fuß, am Ende ein Wasserfall mit klaren Becken und natürlichen Whirlpools. Ruhiger als Benahavís, dafür rauere Zufahrt.",
        "Three kilometres of easy track from the parking, about 30 minutes on foot, ending at a waterfall with clear pools and natural jacuzzis. Quieter than Benahavís, rougher access road."],
     url:"https://maps.google.com/?q=Charco+del+Canalón+Istán"},
    {n:["Nacimiento del Río Molinos, Istán","Nacimiento del Río Molinos, Istán"], h:["gratis","free"],
     d:["Fünfzehn Minuten zu Fuß aus dem Ortskern zu einer Quelle, an der Einheimische Flaschen füllen. Leicht dranzuhängen, durchgehend schattig.",
        "Fifteen minutes on foot from the centre of Istán to a spring where locals fill bottles. Easy add on, shaded the whole way."],
     url:"https://maps.google.com/?q=Nacimiento+del+Rio+Molinos+Istan"},
    {n:["Das Dorf Benahavís","Benahavís village"], h:["gratis","free"],
     d:["Zwanzig Restaurants in einem Dorf mit 3.000 Einwohnern, eingeklemmt in ein Flusstal. In fünfzehn Minuten abgelaufen, und genau darum geht es.",
        "Twenty restaurants in a village of 3,000 people, wedged in a river valley. Walkable in fifteen minutes, which is the point."],
     url:"https://maps.google.com/?q=Benahavis"},
    {n:["Embalse de la Concepción","Embalse de la Concepción"], h:["gratis","free"],
     d:["Der Stausee unterhalb von Istán, mit Aussichtspunkten an der Straße hinauf. Baden verboten, aber die Fahrt ist der gute Teil.",
        "The reservoir below Istán, with viewpoints on the road up. No swimming, but the drive is the good part."]}
  ],
  food:[

        "Suckling pig with paper thin skin, beef Wellington, lamb, tables out in the street. Michelin listed for years without a star, which is exactly the right place to be."],

        "4.9 from 360 reviews, balcony tables, aubergine with honey that people write essays about. Evenings only, closed Wednesday and Sunday."],
     meta:"18:00–23:30 · +34 951 54 97 38",
     url:"https://maps.google.com/?q=Restaurante+Sabor+Benahavis"},
    {n:["The Village, La Heredia","The Village, La Heredia"], tier:"mid", closed:[],

},
{
  id:"axarquia", name:["Axarquía: Nerja und Frigiliana","Axarquía: Nerja and Frigiliana"],
  drive:["~1 Std. 25","~1 h 25"], dist:["~100 km nach Osten","~100 km east"], tags:[],
  when:["Nur wenn ihr wirklich wollt. Die längste Fahrt der Liste.","Only if you want it. The longest drive on the list."],
  pitch:["Das weißeste der weißen Dörfer, maurischer Straßengrundriss intakt, das größte Höhlensystem der Küste und das klarste Wasser der Provinz. Dazu zweieinhalb Stunden im Auto, also konkurriert es direkt mit einem Tag am Pool.",
         "The whitest of the white villages with its Moorish street plan intact, the biggest cave system on the coast, and the clearest water in the province. Also two and a half hours in the car, so it competes directly with a day at the pool."],
  trap:["Old Town Restaurant in Frigiliana hat Mittwoch und Donnerstag zu. Frigiliana mittags im August ist ein weißer Backofen, also das Dorf zur goldenen Stunde und die Küste früher. Der Zugang zum Río Chíllar hatte in den letzten Sommern Obergrenzen, also vorher prüfen.",
        "Old Town Restaurant in Frigiliana closes Wednesday and Thursday. Frigiliana at midday in August is a white oven, so do the village at golden hour and the coast earlier. Río Chíllar access has had capacity limits in recent summers, so check before counting on it."],
  sights:[
    {n:["Altstadt von Frigiliana","Frigiliana old town"], h:["gratis","free"],
     d:["Auf dem öffentlichen Parkplatz im Ort parken und hochlaufen. Gepflasterte Rampen, Keramiktafeln, die den Morisken-Aufstand erzählen, überall Bougainvillea. Sonnenuntergang oben an der Calle Real.",
        "Park in the public car park in the centre and walk up. Cobbled ramps, ceramic panels telling the Morisco rebellion story, bougainvillea everywhere. Sunset from the top of Calle Real."],
     url:"https://maps.google.com/?q=Casco+historico+de+Frigiliana"},
    {n:["Cueva de Nerja","Cueva de Nerja"], h:["~15 € · online buchen","~€15 · book online"],
     d:["Riesige Kammern mit einem Rekord-Stalagmiten, drinnen ganzjährig kühl. Das meistgefragte Ticket der Axarquía im August.",
        "Enormous chambers with a record-holding stalagmite, and cool inside all year. Busiest ticket in the Axarquía in August."],
     url:"https://maps.google.com/?q=Cueva+de+Nerja"},
    {n:["Balcón de Europa","Balcón de Europa"], h:["gratis","free"],
     d:["Palmengesäumte Landzunge, direkt aufs Meer gesetzt, mit dem Strand Calahonda in der Bucht darunter.",
        "Palm lined promontory dropped straight onto the sea, with Calahonda beach in the cove underneath."],
     url:"https://maps.google.com/?q=Balcón+de+Europa+Nerja"},
    {n:["Playa de Maro","Playa de Maro"], h:["gratis","free"],
     d:["Zehn Minuten östlich, eine Bucht unter Klippen, das klarste Wasser dieser Küste. Steiler Abstieg, Kajaks zu mieten, Wasserfall hinter der Landzunge.",
        "Ten minutes east, a cove under cliffs, clearest water on this coast. Steep walk down, kayaks for hire, waterfall around the headland."],
     url:"https://maps.google.com/?q=Playa+de+Maro"},
    {n:["Río Chíllar","Río Chíllar"], h:["gratis · Zugang prüfen","free · check access"],
     d:["Im Wasser selbst flussaufwärts laufen, so weit ihr wollt, durch eine sich verengende Schlucht. Perfekt bei Hitze, aber der Zugang war zuletzt beschränkt, also vorher verifizieren.",
        "Walk up a river in the water itself for as long as you like, through a narrowing gorge. Perfect in a heatwave, but access has been restricted in recent summers, so verify first."],
     url:"https://maps.google.com/?q=Rio+Chillar+Nerja"}
  ],
  food:[

     d:["Terrasse über den Dächern, 4,8 aus knapp 600 Bewertungen, und die Inhaber arbeiten selbst im Raum. Fisch und Schwein kommen beide richtig raus.",
        "Terrace over the rooftops, 4.8 from close to 600 reviews, and owners working the room themselves. Fish and pork both come out right."],

    {n:["Chiringuitos am Playa Burriana, Nerja","Burriana beach chiringuitos, Nerja"], tier:"street", closed:[],
     d:["Der Espeto de sardinas ist der Punkt: sechs Sardinen auf einem Rohrstock über brennendem Olivenholz, etwa 5 €. Jedes Lokal mit rauchendem Boot davor.",

{
  id:"antequera", name:["Antequera, El Torcal und die Dolmen","Antequera, El Torcal and the dolmens"],
  drive:["~1 Std.","~1 h"], dist:["~85 km über die A-45","~85 km via the A-45"], tags:[],
  when:["Di bis So. Die Dolmen haben montags zu und öffnen im Sommer abends nochmal 19:00–21:30.","Tue to Sun. The dolmens shut Monday and reopen 19:00–21:30 in summer."],
  pitch:["Grabkammern, gebaut um 3.800 v. Chr., ein Kalksteinlabyrinth auf 1.200 m, und ein Berg in Form eines schlafenden Gesichts, auf den einer der Dolmen bewusst ausgerichtet wurde statt auf die Sonne. Das Beste in der Provinz, um das sich fast niemand von dieser Küste kümmert.",
         "Burial chambers built around 3,800 BC, a limestone labyrinth at 1,200 m, and a mountain shaped like a sleeping human face that one of the dolmens was deliberately aligned to point at rather than at the sun. The best thing in the province that almost nobody staying on this coast bothers with."],
  trap:["Dolmen montags zu, sonst 09:00–13:30 und 19:00–21:30, sonntags bis 14:30. Der Parkplatz am Torcal ist im Sommer bis zum späten Vormittag voll, und die Wege sind scharfkantiger, unebener Fels, also mindestens Turnschuhe. Mar de Gloria hat donnerstags zu, Mesón Adarve montags und sonntags.",
        "Dolmens closed Monday, otherwise 09:00–13:30 and 19:00–21:30, Sunday to 14:30. El Torcal's car park fills by mid morning in summer and the paths are sharp, uneven rock, so trainers at minimum. Mar de Gloria closes Thursday, Mesón Adarve closes Monday and Sunday."],
  sights:[
    {n:["Dolmen de Menga","Dolmen de Menga"], h:["gratis · Mo zu","free · closed Mon"],
     d:["Der älteste und größte Dolmen des Kontinents, rund 5.800 Jahre alt, und kostenlos. Zweiunddreißig Tragsteine, einer davon etwa 150 Tonnen, dazu ein Museum und ein zehnminütiger Film, der das Ganze einordnet. Das Sommerfenster ab 19:00 ist die zivilisierte Art, das zu sehen.",
        "The oldest and largest dolmen on the continent, roughly 5,800 years old, and free. Thirty two supporting stones, one of them weighing about 150 tonnes, plus a museum and a ten minute film that makes sense of it. The summer evening slot from 19:00 is the civilised way to see it."],
     url:"https://maps.google.com/?q=Dolmen+de+Menga+Antequera"},
    {n:["Peña de los Enamorados","Peña de los Enamorados"], h:["gratis · an der Straße","free · roadside"],
     d:["Der Felsen der Liebenden, ein Kalksteinhügel, der sich als rücklings liegendes Gesicht lesen lässt. Mengas Gang zeigt darauf, was ihn zum einzigen bekannten Dolmen Europas macht, der auf ein Landschaftsmerkmal statt auf die Sonne ausgerichtet ist. Wer das Gesicht einmal gesehen hat, sieht es immer.",
        "The Lovers' Rock, a limestone hill that reads as a face lying on its back. Menga's corridor points at it, which makes this the only known dolmen in Europe oriented on a landmark rather than on the sun. Once you see the face you cannot unsee it."],
     url:"https://maps.google.com/?q=Peña+de+los+Enamorados"},
    {n:["El Torcal de Antequera","El Torcal de Antequera"], h:["gratis · 09:30–17:00 täglich","free · 09:30–17:00 daily"],
     d:["Eine Karstlandschaft aus Kalkstein, von 150 Millionen Jahren Wetter zu Türmen und Pilzen gestapelt. Die grüne Route ist eine 45-Minuten-Schleife ab Parkplatz, die gelbe dauert etwa zwei Stunden. Auf 1.200 m läuft es einige Grad kühler als an der Küste, und das Besucherzentrum hat ein überraschend ordentliches Restaurant.",
        "A karst plateau of limestone stacked into towers and mushrooms by 150 million years of weather. Green route is a 45 minute loop from the car park, yellow is about two hours. At 1,200 m it runs several degrees cooler than the coast, and there is a visitor centre with a surprisingly decent restaurant."],
     url:"https://maps.google.com/?q=Centro+de+Visitantes+El+Torcal+Alto"},
    {n:["Alcazaba und Real Colegiata","Alcazaba and Real Colegiata"], h:"~6 €",
     d:["Maurische Festung und eine Renaissance-Stiftskirche auf demselben Hügel über der Stadt, mit der Peña im Hintergrund. Eine Stunde, und in Teilen gnädig schattig.",
        "Moorish fortress and a renaissance collegiate church sharing a hilltop over the town, with the Peña framed behind. An hour, and mercifully shaded in parts."],
     url:"https://maps.google.com/?q=Alcazaba+de+Antequera"},
    {n:["El Romeral und Viera","El Romeral and Viera"], h:["gratis · gleiches Gelände","free · same ticket area"],
     d:["Die beiden anderen Kammern des UNESCO-Ensembles. El Romeral ist ein Tholos mit Bienenkorbgewölbe und fühlt sich ganz anders an als Menga. Zehn Minuten entfernt und meistens leer.",
        "The other two chambers of the UNESCO site. El Romeral is a tholos with a beehive vault and a very different feel to Menga. Ten minutes away, and usually empty."]}
  ],
  food:[
    {n:["Mar de Gloria","Mar de Gloria"], tier:"mid", closed:["thu"],
     d:["Familiengeführt, 4,9 aus fast 1.800 Bewertungen, und Gäste beschreiben immer wieder ein Fünf-Gänge-Menü mit Weinbegleitung zu einem Preis, der die Küste blamiert. Per WhatsApp reservieren, der Raum ist klein.",
        "Family run, 4.9 from nearly 1,800 people, and visitors keep describing a five course meal with pairings for a price that embarrasses the coast. Book by WhatsApp; the room is small."],
     meta:"12:30–16:30, 19:30–22:30 · +34 951 99 12 76",
     url:"https://maps.google.com/?q=Mar+de+Gloria+Antequera"},
    {n:["Mesón Adarve","Mesón Adarve"], tier:"mid", closed:["mon","sun"],
     d:["Winziger Vorderraum, Familienbetrieb, roter Thunfisch von der Küste bei Gibraltar. Artischocken-Timbal, Rabo de toro, Schokoladenkroketten. Reservieren.",
        "Tiny front room, family operated, bluefin tuna brought up from the Gibraltar coast. Artichoke timbal, rabo de toro, chocolate croquetas. Reserve."],
     meta:"13:00–15:30, 20:00–22:30 · +34 609 43 24 02",
     url:"https://maps.google.com/?q=Mesón+Adarve+Antequera"},
    {n:["Abrasador El Cortijo La Martina","Abrasador El Cortijo La Martina"], tier:"mid", closed:[],
     d:["Jeden Tag durchgehend am Nachmittag offen, was das Timing-Problem nach dem Torcal löst. Grillhaus, Linseneintopf, Lachs in Pistazienkruste.",
        "Open through the afternoon every day, which solves the post-Torcal timing problem. Grill house, lentil stew, pistachio crusted salmon."],
     meta:["12:00–18:00 · Fr/Sa auch 20:00–24:00 · +34 652 33 24 10","12:00–18:00 · Fri/Sat also 20:00–24:00 · +34 652 33 24 10"],
     url:"https://maps.google.com/?q=Abrasador+El+Cortijo+La+Martina+Antequera"},
    {n:["Porra antequerana, überall","Porra antequerana, anywhere"], tier:"street", closed:[],
     d:["Das eigene Gericht der Stadt: eine dickere, schwerere Verwandte des Salmorejo, kalt serviert mit Ei und Thunfisch oder Jamón obendrauf. Bestellt sie, wo immer ihr landet, und schließt mit Bienmesabe ab, einem Biskuit-Mandel-Ding aus den Klöstern.",
        "The town's own dish: a thicker, heavier cousin of salmorejo, served cold with egg and tuna or jamón on top. Order it wherever you land, and finish with bienmesabe, which is a sponge and almond thing from the convents."]}
  ]

{

  pitch:["Eine vollständige römische Stadt an einem Atlantikstrand, daneben eine dreißig Meter hohe Sanddüne und Marokko vierzehn Kilometer über dem Wasser. Anderes Meer, anderes Licht, ständiger Wind, und überhaupt nicht wie die Mittelmeerküste, an der ihr schlaft.",
         "A complete Roman town sitting on an Atlantic beach, with a thirty metre sand dune beside it and Morocco fourteen kilometres across the water. Different sea, different light, constant wind, and nothing at all like the Mediterranean coast you are sleeping on."],
  trap:["Baelo Claudia hat montags zu und öffnet nur 09:00–14:30. Otero hat sonntags zu, Miramar freitags, El Guapo donnerstags. Wenn der Levante bläst, sandstrahlt euch der Strand, also vor zwei Stunden Fahrt die Windvorhersage prüfen.",
        "Baelo Claudia is closed Monday and open 09:00–14:30 only. Otero closes Sunday, Miramar closes Friday, El Guapo closes Thursday. When the levante blows the beach sandblasts you, so check the wind forecast before committing two hours of driving."],
  sights:[

     d:["Ende des zweiten Jahrhunderts v. Chr. als Hafen für den Handel mit Tingis gegründet, dem heutigen Tanger, und eine der vollständigsten römischen Städte überhaupt. Forum, Basilika, Theater, Tempel, Thermen, die Fischsalzerei, und ihr lauft mittendurch statt hinter einer Absperrung. 4,6 aus 18.000 Bewertungen.",
        "Founded in the late second century BC as the port trading with Tingis, modern Tangier, and one of the most complete Roman towns anywhere. Forum, basilica, theatre, temples, baths, the fish salting works, and you walk among it rather than behind a rope. 4.6 from 18,000 people."],
     url:"https://maps.google.com/?q=Baelo+Claudia+Bolonia"},
    {n:["Duna de Bolonia","Duna de Bolonia"], h:["gratis","free"],

        "A living dune thirty metres high piled against the pine wood at the end of the beach. Hard walk up in soft sand, and the view back over the ruins and across to Africa pays for it."],
     url:"https://maps.google.com/?q=Duna+de+Bolonia"},
    {n:["Playa de Bolonia","Playa de Bolonia"], h:["gratis","free"],

    {n:["Altstadt von Tarifa","Tarifa old town"], h:["gratis · 20 Min. von Bolonia","free · 20 min from Bolonia"],
     d:["Gassen innerhalb der Mauern, die Burg Guzmán el Bueno, und der Damm zur Isla de las Palomas, wo Mittelmeer und Atlantik offiziell aufeinandertreffen. Kitesurf-Stadt, also jüngeres und schrofferes Publikum als Marbella.",
        "Walled lanes, the Guzmán el Bueno castle, and the causeway to Isla de las Palomas where the Mediterranean and the Atlantic officially meet. Kitesurf town, so the crowd is younger and scruffier than Marbella."],

    {n:["Walbeobachtung, Hafen Tarifa","Whale watching, Tarifa port"], h:["~45 € · vorher buchen","~€45 · book ahead"],
     d:["Grindwale und Delfine das ganze Jahr in der Meerenge, dazu Orcas im Juli und August rund um die Thunfischzüge. Zwei Stunden, und Sichtungen sind wahrscheinlich, nicht garantiert.",
        "Pilot whales and dolphins year round in the Strait, with orcas appearing in July and August around the tuna. Two hours, and sightings are likely rather than guaranteed."]}

{
  id:"genal", name:["Valle del Genal: die Kastaniendörfer","Valle del Genal: the chestnut villages"],
  drive:["~1 Std. 10","~1 h 10"], dist:["~75 km über Estepona","~75 km via Estepona"], tags:[],
  when:["Jeder Tag. Kühler als die Küste und wirklich leer.","Any day. Cooler than the coast, and genuinely empty."],
  pitch:["Ein Tal voller Kastanienwald mit einem Dutzend Dörfern, die kaum Besucher sehen. Genalguacil stellt seit 1994 Skulpturen in die eigenen Gassen und ist inzwischen ein Museum, durch das man kostenlos hindurchläuft. Das bewusste Anti-Marbella, und die einzige Zone hier, in der ihr womöglich keinen anderen Ausländer trefft.",
         "A valley of chestnut forest holding a dozen villages that see almost no visitors. Genalguacil has been installing sculpture in its own streets since 1994 and is now a museum you walk through for free. This is the deliberate anti-Marbella, and the only zone on this list where you might not see another foreigner."],
  trap:["Bergstraßen, also dauert die Fahrt länger als die Entfernung vermuten lässt, und jemandem wird schlecht. Kastaniensaison ist Oktober, Ende Juli ist es grün statt spektakulär. Júzcars blaue Masche ist verbraucht: 3,7 Sterne, die Schlumpffiguren größtenteils weg, und Bewertungen, die es ein kaputtes Dorf nennen. Casa Grande braucht eine Reservierung.",
        "Mountain roads, so the drive takes longer than the distance suggests and somebody will feel it. Chestnut season is October, so late July is green rather than spectacular. Júzcar's blue-village gimmick has worn thin: 3.7 rating, most of the Smurf statues gone, and reviews calling it a broken town. Casa Grande needs booking."],
  sights:[
    {n:["Genalguacil, Pueblo Museo","Genalguacil, Pueblo Museo"], h:["gratis","free"],
     d:["Skulpturen und Wandbilder, die seit 1994 alle zwei Jahre eingeladene Künstler in den Gassen zurücklassen. Unter 500 Einwohner, und das ganze Dorf ist das Exponat. In einer Stunde abgelaufen, danach irgendwo mit Talblick sitzen.",
        "Sculptures and murals left in the streets by artists invited every two years since 1994. Population under 500, and the whole village is the exhibit. Walk it in an hour, then sit down somewhere with a view of the valley."],
     url:"https://maps.google.com/?q=Genalguacil"},
    {n:["Valle del Genal","Valle del Genal"], h:["gratis","free"],
     d:["Kastanienwald über das ganze obere Tal, mit markierten Wegen zwischen den Dörfern. Schattig, mehrere Grad kühler als die Küste, und 4,7 bewertet von den wenigen Leuten, die ein Tal überhaupt bewerten.",
        "Chestnut forest across the whole upper valley, with marked walks between villages. Shaded, several degrees cooler than the coast, and rated 4.7 by the handful of people who bother to review a valley."],
     url:"https://maps.google.com/?q=Valle+del+Genal"},
    {n:["Alpandeire","Alpandeire"], h:["gratis","free"],
     d:["Steindorf hoch an der Westflanke mit einer überdimensionierten Kirche und einem Hotelrestaurant, für das Leute eine Stunde fahren.",
        "Stone village high on the western side with an outsized church and a hotel restaurant that people drive an hour for."],
     url:"https://maps.google.com/?q=Alpandeire"},
    {n:["Gaucín","Gaucín"], h:["gratis","free"],
     d:["Burg auf einem Grat mit Blick hinunter nach Gibraltar und an klaren Tagen hinüber nach Afrika. Die spektakulärste Lage aller Dörfer im Tal.",
        "Castle on a ridge with a view down to Gibraltar and across to Africa on a clear day. The most spectacular position of any village in the valley."]},
    {n:["Júzcar, das blaue Dorf","Júzcar, the blue village"], h:["gratis · Erwartungen dämpfen","free · manage expectations"],
     d:["2011 für eine Filmpremiere komplett blau gestrichen und nie neu gestrichen. Auf Fotos immer noch auffällig, in echt dünner: 3,7 aus 2.300 Bewertungen, wenig Infrastruktur und eine kurvige Zufahrt. Dreißig Minuten wert, wenn ihr vorbeikommt, nicht die Fahrt allein.",
        "Painted entirely blue for a film premiere in 2011 and never repainted. Still striking in photographs, thinner in person: 3.7 from 2,300 reviews, few facilities, and a twisting access road. Worth thirty minutes if you are passing, not worth the drive alone."],
     url:"https://maps.google.com/?q=Juzcar"}
  ],
  food:[
    {n:["Casa Grande de Alpandeire","Casa Grande de Alpandeire"], tier:"mid", closed:[],
     d:["Hotel und Restaurant in einem umgebauten Stallgebäude, bei dessen Renovierung eine verborgene Kammer gefunden wurde. 4,8 aus 419 Bewertungen, formelles Menü und Tapas, Ente mit Blaubeersauce, Rührei mit Steinpilzen und Foie. Jesús und Rosa werden in der Hälfte der Bewertungen namentlich genannt. Reservieren.",
        "Hotel and restaurant in a converted cattle building with a hidden chamber found during the renovation. 4.8 from 419 reviews, formal menu and tapas both, duck with blueberry sauce, boletus and foie scramble. Jesús and Rosa get named in half the reviews. Book."],

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const num=n=>n.toLocaleString(LANG===0?"de-DE":"en-GB");
const dec=n=>LANG===0?n.toFixed(1).replace(".",","):n.toFixed(1);
const keyOf=n=>Array.isArray(n)?n[1]:n;   // stable English/Spanish identifier used for INFO + map lookups

function chips(n){
  const key=keyOf(n);
  const i=INFO[key]; if(!i) return "";
  const out=[];
  if(i[0]) out.push(`<span class="gchip star">★ ${dec(i[0])} <b>${num(i[1])}</b></span>`);
  if(i[2]) out.push(`<span class="gchip">${"€".repeat(i[2])}</span>`);
  return out.length?`<span class="gchips">${out.join("")}</span>`:"";
}
function mapBtn(n,url){
  const key=keyOf(n), label=T(n);
  const i=INFO[key]||[];
  const q=(i[3]!=null&&i[3]!==0)?i[3]+","+i[4]:(url?decodeURIComponent(url.split("?q=")[1]||key).replace(/\+/g," "):key);
  return `<button class="mapbtn" data-n="${esc(key)}" data-label="${esc(label)}" data-q="${esc(q)}" data-tel="${esc(i[5]||"")}" data-url="${esc(url||"")}">${T(UI.btnMap)}</button>`;
}

function catFor(f){
  const hay=(keyOf(f.n)+" "+keyOf(f.d)).toLowerCase();
  if(/taco|taquer/.test(hay)) return "tacos";
  if(/grill|asador|parrill|charcoal|suckling|wellington|iberian meat|mixed grill|dolma|honey cake/.test(hay)) return "grill";
  if(/seafood|fish|prawn|calamar|paella|espeto|sardine|tuna|atún|octopus|pulpo|mussel|clam|marisco|frit|swordfish|bass|mullet/.test(hay)) return "seafood";

}

function drawMap(order){
  const place=Object.fromEntries(order.map((r,i)=>[r.id,i]));
  const coast=COAST.map(c=>px(c[0]).toFixed(1)+","+py(c[1]).toFixed(1)).join(" ");
  let s=`<rect class="land" x="0" y="0" width="${MAPW}" height="${MAPH}"/>`;
  s+=`<polygon class="sea" points="${coast} ${MAPW},${MAPH} 0,${MAPH}"/>`;
  s+=`<text class="geo" x="430" y="556">${T(SEA.med)}</text>`;
  s+=`<text class="geo" x="95" y="545">${T(SEA.mor)}</text>`;
  const bx=px(LL.home[1]),by=py(LL.home[0]);
  RANK.forEach(r=>{if(r.id!=="home")
    s+=`<line class="spoke" x1="${bx}" y1="${by}" x2="${px(LL[r.id][1])}" y2="${py(LL[r.id][0])}"/>`;});
  s+=`<g class="base"><rect x="${bx-7}" y="${by-7}" width="14" height="14" rx="2"/></g>`;
  RANK.forEach(r=>{
    const i=place[r.id],c=i<3?"var(--buganvilla)":i<6?"var(--azul)":"var(--stone)";
    const rad=i<3?10:i<6?8:6.5;
    const x=px(LL[r.id][1]),y=py(LL[r.id][0]);
    const [dx,dy,an]=LABPOS[r.id];
    if(r.id!=="home") s+=`<g class="pin" data-z="${r.id}"><circle cx="${x}" cy="${y}" r="${rad}" fill="${c}"/></g>`;
    s+=`<text class="lbl" x="${x+dx}" y="${y+dy}" text-anchor="${an}">${T(MAPNAME[r.id])}</text>`;
    s+=`<text class="sub" x="${x+dx}" y="${y+dy+17}" text-anchor="${an}">${T(DRIVE[r.id])}</text>`;
  });
  document.getElementById("zmap").innerHTML=s;
}

/* ---------- ranking ---------- */
function drawRank(mode){
  sortMode=mode;
  const order=RANK.slice().sort((a,b)=>
    mode==="u"?b.u-a.u||b.e-a.e:
    mode==="e"?b.e-a.e||b.u-a.u:
    mode==="h"?a.h-b.h||(b.u+b.e)-(a.u+a.e):
               (b.u+b.e)-(a.u+a.e)||b.e-a.e);
  document.getElementById("rank").innerHTML=order.map((r,i)=>`
    <li class="${i<3?"tier1":i<6?"tier2":""}">
      <div class="rk">
        <a href="#${r.id}">${T(r.s)}</a>
        <p>${T(r.v)}</p>
        <div class="bars">
          <span class="bar"><span>${T(UI.bUnique)}</span><span class="track"><span class="fill u" style="width:${r.u*10}%"></span></span><b>${r.u}</b></span>
          <span class="bar"><span>${T(UI.bDay)}</span><span class="track"><span class="fill" style="width:${r.e*10}%"></span></span><b>${r.e}</b></span>
          <span class="hrs-chip">${r.h?dec(r.h)+" "+T(UI.hDrive):T(UI.hNone)}</span>
        </div>
      </div>
    </li>`).join("");
  drawMap(order);
}

    z.querySelector(".zhead").setAttribute("aria-expanded","true");}
});
document.getElementById("week").addEventListener("click",e=>{
  const a=e.target.closest("a"); if(!a) return;
  const z=document.querySelector(a.getAttribute("href"));
  if(z&&!z.classList.contains("open")){z.classList.add("open");
    z.querySelector(".zhead").setAttribute("aria-expanded","true");}
});
document.getElementById("copybtn").addEventListener("click",async e=>{
  try{
    await navigator.clipboard.writeText(document.getElementById("es").textContent.trim());
    e.target.textContent=T(UI.copyOk);
    setTimeout(()=>e.target.textContent=T(UI.copyBtn),1800);
  }catch{e.target.textContent=T(UI.copyFail);}
});

/* ---------- map sheet ---------- */
const SHEET=document.getElementById("sheet");
let lastFocus=null;
function openSheet(b){
  const n=b.dataset.n,label=b.dataset.label||n,q=b.dataset.q,tel=b.dataset.tel,url=b.dataset.url;
  const i=INFO[n];
  lastFocus=b;
  document.getElementById("sheetTitle").textContent=label;
  const bits=[];
  if(i&&i[0]) bits.push("★ "+dec(i[0])+" · "+num(i[1])+" "+T(UI.reviews));
  if(i&&i[2]) bits.push("€".repeat(i[2]));
  document.getElementById("sheetSub").textContent=bits.join("  ·  ");
  document.getElementById("sheetFrame").src=
    "https://www.google.com/maps?q="+encodeURIComponent(q)+"&z=16&hl="+(LANG===0?"de":"en")+"&output=embed";
  const acts=[`<a class="primary" href="${url||"https://maps.google.com/?q="+encodeURIComponent(q)}" target="_blank" rel="noopener">${T(UI.sheetOpen)}</a>`,
    `<a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}" target="_blank" rel="noopener">${T(UI.sheetDir)}</a>`];
  if(tel) acts.push(`<a href="tel:${tel}">${T(UI.sheetCall)}</a>`);
  document.getElementById("sheetActs").innerHTML=acts.join("");
  SHEET.hidden=false;
  document.body.classList.add("locked");
  SHEET.querySelector(".sheet-x").focus();
}
function closeSheet(){
  SHEET.hidden=true;
  document.getElementById("sheetFrame").src="about:blank";
  document.body.classList.remove("locked");
  if(lastFocus) lastFocus.focus();
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".mapbtn"); if(b){openSheet(b);return;}
  if(e.target.closest("[data-close]")){closeSheet();return;}
  const h=e.target.closest(".zhead");
  if(h){const open=h.parentElement.classList.toggle("open");h.setAttribute("aria-expanded",open);}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!SHEET.hidden) closeSheet();});
</script>
</body>
